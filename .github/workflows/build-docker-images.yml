name: CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list-targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list-targets
        uses: docker/bake-action/subaction/list-targets@v6
        with:
          target: magistrate-build-all

  bake:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: docker-output/build/ci/ccache
          key: ${{ matrix.target }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.target }}-${{ github.ref }}

      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          targets: ${{ matrix.target }}
          files: docker-bake.hcl
          push: ${{ github.ref == 'refs/heads/develop' }}
          set: |
            *.cache-from=type=gha,scope=${{ matrix.target }}
            *.cache-to=type=gha,scope=${{ matrix.target }},mode=max
            *.output=type=local,dest=docker-output
            *.args.CI_CCACHE_DIR=/build/ci/ccache
